# Pull request validation: builds Release and runs the tests. Publishes nothing.
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The test project targets net9.0, so the .NET 9 runtime is needed alongside the .NET 10 SDK.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Restore
        run: dotnet restore DSoft.Fetchify.Api.Client.slnx

      - name: Build
        run: dotnet build DSoft.Fetchify.Api.Client.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UnitTests/UnitTests.csproj --configuration Release --no-build
